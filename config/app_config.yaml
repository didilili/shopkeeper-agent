# 所有环境共享的配置资产基线。敏感信息只允许从环境变量或本地 .env 注入。
runtime:
  app_name: ${oc.env:APP_NAME,shopkeeper-agent}
  environment: development
  debug: false

logging:
  file:
    enable: true
    level: ${oc.env:LOG_FILE_LEVEL,INFO}
    path: ${oc.env:LOG_FILE_PATH,logs}
    rotation: ${oc.env:LOG_ROTATION,10 MB}
    retention: ${oc.env:LOG_RETENTION,7 days}
  console:
    enable: true
    level: ${oc.env:LOG_CONSOLE_LEVEL,INFO}

db_meta:
  host: ${oc.env:DB_META_HOST,127.0.0.1}
  port: ${oc.env:DB_META_PORT,3306}
  user: ${oc.env:DB_META_USER,didilili}
  password: ${oc.env:DB_META_PASSWORD,''}
  database: ${oc.env:DB_META_NAME,meta}
  pool_size: ${oc.env:DB_META_POOL_SIZE,10}
  max_overflow: ${oc.env:DB_META_MAX_OVERFLOW,20}
  pool_recycle: ${oc.env:DB_META_POOL_RECYCLE,1800}
  connect_timeout: ${oc.env:DB_META_CONNECT_TIMEOUT,10}

db_dw:
  host: ${oc.env:DB_DW_HOST,127.0.0.1}
  port: ${oc.env:DB_DW_PORT,3306}
  user: ${oc.env:DB_DW_USER,didilili}
  password: ${oc.env:DB_DW_PASSWORD,''}
  database: ${oc.env:DB_DW_NAME,dw}
  pool_size: ${oc.env:DB_DW_POOL_SIZE,10}
  max_overflow: ${oc.env:DB_DW_MAX_OVERFLOW,20}
  pool_recycle: ${oc.env:DB_DW_POOL_RECYCLE,1800}
  connect_timeout: ${oc.env:DB_DW_CONNECT_TIMEOUT,10}

qdrant:
  host: ${oc.env:QDRANT_HOST,127.0.0.1}
  port: ${oc.env:QDRANT_PORT,6333}
  embedding_size: ${oc.env:QDRANT_EMBEDDING_SIZE,1024}
  api_key: ${oc.env:QDRANT_API_KEY,''}
  timeout: ${oc.env:QDRANT_TIMEOUT,10}

embedding:
  host: ${oc.env:EMBEDDING_HOST,127.0.0.1}
  port: ${oc.env:EMBEDDING_PORT,8081}
  model: ${oc.env:EMBEDDING_MODEL,BAAI/bge-large-zh-v1.5}
  timeout: ${oc.env:EMBEDDING_TIMEOUT,30}

es:
  scheme: ${oc.env:ES_SCHEME,http}
  host: ${oc.env:ES_HOST,127.0.0.1}
  port: ${oc.env:ES_PORT,9200}
  index_name: ${oc.env:ES_INDEX_NAME,data_agent}
  username: ${oc.env:ES_USERNAME,''}
  password: ${oc.env:ES_PASSWORD,''}
  request_timeout: ${oc.env:ES_REQUEST_TIMEOUT,30}

retrieval:
  max_concurrency: ${oc.env:RETRIEVAL_MAX_CONCURRENCY,8}
  max_queries: ${oc.env:RETRIEVAL_MAX_QUERIES,12}
  column:
    score_threshold: ${oc.env:COLUMN_RETRIEVAL_SCORE_THRESHOLD,0.6}
    per_query_limit: ${oc.env:COLUMN_RETRIEVAL_PER_QUERY_LIMIT,20}
    final_limit: ${oc.env:COLUMN_RETRIEVAL_FINAL_LIMIT,20}
    rrf_k: ${oc.env:COLUMN_RETRIEVAL_RRF_K,60}
    exact_match_boost: ${oc.env:COLUMN_RETRIEVAL_EXACT_BOOST,0.05}
  metric:
    score_threshold: ${oc.env:METRIC_RETRIEVAL_SCORE_THRESHOLD,0.6}
    per_query_limit: ${oc.env:METRIC_RETRIEVAL_PER_QUERY_LIMIT,20}
    final_limit: ${oc.env:METRIC_RETRIEVAL_FINAL_LIMIT,10}
    rrf_k: ${oc.env:METRIC_RETRIEVAL_RRF_K,60}
    exact_match_boost: ${oc.env:METRIC_RETRIEVAL_EXACT_BOOST,0.05}
  value:
    score_threshold: ${oc.env:VALUE_RETRIEVAL_SCORE_THRESHOLD,0.6}
    per_query_limit: ${oc.env:VALUE_RETRIEVAL_PER_QUERY_LIMIT,20}
    final_limit: ${oc.env:VALUE_RETRIEVAL_FINAL_LIMIT,20}
    rrf_k: ${oc.env:VALUE_RETRIEVAL_RRF_K,60}
    exact_match_boost: ${oc.env:VALUE_RETRIEVAL_EXACT_BOOST,0.05}

sql_execution:
  max_sql_length: ${oc.env:SQL_MAX_LENGTH,12000}
  max_result_rows: ${oc.env:SQL_MAX_RESULT_ROWS,1000}
  query_timeout_seconds: ${oc.env:SQL_QUERY_TIMEOUT_SECONDS,30}
  max_correction_attempts: ${oc.env:SQL_MAX_CORRECTION_ATTEMPTS,2}

api_access:
  enabled: ${oc.env:API_AUTH_ENABLED,false}
  api_key: ${oc.env:API_AUTH_KEY,''}
  rate_limit_requests: ${oc.env:API_RATE_LIMIT_REQUESTS,60}
  rate_limit_window_seconds: ${oc.env:API_RATE_LIMIT_WINDOW_SECONDS,60}
